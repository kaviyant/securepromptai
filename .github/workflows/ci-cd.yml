name: SecurePrompt AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Linting and Automated Testing Job
  test:
    name: Lint & Test Suite Execution
    runs-on: ubuntu-latest

    services:
      # Spin up MongoDB container for Integration Testing
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential procps

      - name: Install Python Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx mongomock
          pip install -r backend/requirements.txt
          pip install -r engine/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Flake8 Code Quality Checks
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Execute Pytest Suite (Unit & Integration)
        env:
          MONGODB_URL: mongodb://localhost:27017
          DATABASE_NAME: secureprompt_test_db
          JWT_SECRET_KEY: test_secret_key_for_testing_purposes_only
          JWT_REFRESH_SECRET_KEY: test_refresh_secret_key_for_testing_purposes_only
          GROQ_API_KEY: mock_api_key
          MLFLOW_TRACKING_URI: http://localhost:5000
          MLFLOW_MODEL_SYNC: false
        run: |
          python -m pytest tests/test_unit.py tests/test_api.py -v

  # 2. Docker Image Build Validation Job
  build-images:
    name: Build & Validate Containers
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: false # Do not push to registry during PR validation checks
          tags: secureprompt/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build NGINX Proxy Image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          file: nginx/Dockerfile
          push: false
          tags: secureprompt/nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Production CD Deploy Job
  deploy:
    name: Deploy to Production Environment
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Simulate Production Deployment
        run: |
          echo "================================================================"
          echo "DEPLOYING SECUREPROMPT AI SUITE TO PRODUCTION HOST"
          echo "================================================================"
          echo "1. Connecting to production cluster VM via SSH..."
          echo "2. Pulling latest code revisions from GitHub main branch..."
          echo "3. Re-building docker compose application container clusters..."
          echo "4. Refreshing database collections and running migrations..."
          echo "5. Performing rolling container restarts (zero downtime)..."
          echo "Deployment process completed successfully!"
