<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecurePrompt AI</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3z" fill="url(#logo-grad)"/>
          <path d="M12 6v11M8 10h8M9.5 13.5h5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="logo-grad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
              <stop stop-color="#3B82F6"/>
              <stop offset="1" stop-color="#8B5CF6"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="title-group">
          <h1>SecurePrompt AI</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Status Card -->
      <div class="card status-card">
        <div class="status-info">
          <span class="status-label">Global Protection</span>
          <span id="status-text" class="status-value active">Active</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="global-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Connection Status Card -->
      <div class="card connection-card">
        <div class="status-info">
          <span class="status-label">Backend Firewall Connection</span>
          <span id="connection-text" class="status-value inactive">Checking...</span>
        </div>
        <div class="site-dot" id="connection-indicator"></div>
      </div>

      <!-- Current Site Info -->
      <div class="current-site-box">
        <div class="site-dot active" id="site-indicator"></div>
        <div class="site-details">
          <span class="site-label">Current Tab</span>
          <span class="site-domain" id="site-name">Scanning...</span>
        </div>
        <label class="switch-mini">
          <input type="checkbox" id="site-toggle" checked>
          <span class="slider-mini"></span>
        </label>
      </div>

      <!-- Statistics Grid -->
      <div class="stats-section">
        <h2>Security Statistics</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-count" id="stat-scans">0</span>
            <span class="stat-label">Total Scans</span>
          </div>
          <div class="stat-card blocked">
            <span class="stat-count" id="stat-blocked">0</span>
            <span class="stat-label">Blocked</span>
          </div>
          <div class="stat-card sanitized">
            <span class="stat-count" id="stat-warned">0</span>
            <span class="stat-label">Warnings</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button id="btn-history" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Audit Logs
      </button>
      <button id="btn-settings" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Settings
      </button>
    </footer>
  </div>

  <!-- Include configurations and script -->
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
