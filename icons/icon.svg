<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <!-- Sparkle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="2" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(139, 92, 246, 0.1)" stroke-width="1" />

  <!-- Shield Base -->
  <path d="M64 14 L102 24 V58 C102 84.4 85.8 108.9 64 115 C42.2 108.9 26 84.4 26 58 V24 L64 14 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="drop-shadow(0px 8px 16px rgba(59, 130, 246, 0.45))" />

  <!-- Grid Lines inside shield (Security Grid) -->
  <path d="M64 15 V114" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
  <path d="M27 58 H101" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
  <path d="M28 42 C40 46 88 46 100 42" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" fill="none" />
  <path d="M30 75 C42 82 86 82 98 75" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" fill="none" />

  <!-- Sparkles / Spark lines (AI Symbol) -->
  <!-- Spark 1 (Top Left) -->
  <path d="M48 40 L50 48 L58 50 L50 52 L48 60 L46 52 L38 50 L46 48 Z" fill="#ffffff" filter="url(#glow)" opacity="0.9"/>
  <!-- Spark 2 (Center Right) -->
  <path d="M80 56 L81.5 62 L87.5 63.5 L81.5 65 L80 71 L78.5 65 L72.5 63.5 L78.5 62 Z" fill="#ffffff" filter="url(#glow)" opacity="0.95"/>
  <!-- Spark 3 (Mini Spark Top Right) -->
  <path d="M78 30 L79 34 L83 35 L79 36 L78 40 L77 36 L73 35 L77 34 Z" fill="rgba(255,255,255,0.7)"/>

  <!-- Secure Lock Icon (Center Overlay) -->
  <rect x="52" y="74" width="24" height="18" rx="4" fill="#ffffff" />
  <path d="M57 74 V68 C57 64.1 60.1 61 64 61 C67.9 61 71 64.1 71 68 V74" stroke="#ffffff" stroke-width="3" fill="none" />
  <circle cx="64" cy="83" r="2.5" fill="#3B82F6" />
  <path d="M64 85.5 V88" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" />
</svg>
